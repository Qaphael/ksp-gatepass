# Production HTTPS overlay. Run with:
# docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      GATEPASS_DOMAIN: ${GATEPASS_DOMAIN:?Set GATEPASS_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
