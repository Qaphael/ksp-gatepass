# KSP GatePass deployment stack: application + PostgreSQL with a persistent volume.
# Usage: docker compose up -d --build
# Values come from the .env file in this directory (see .env.example).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ksp_gatepass}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ksp_gatepass}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-72}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-5}
      LOGIN_RATE_LIMIT_WINDOW_MINUTES: ${LOGIN_RATE_LIMIT_WINDOW_MINUTES:-15}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
      # Required: AES-256-GCM key for QR tokens at rest. No default on purpose —
      # generate one and put it in your .env before starting the stack.
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
    ports:
      # Host-only development access. Production HTTPS is provided by the
      # optional Caddy profile; app:3000 remains reachable on the Compose network.
      - "127.0.0.1:${APP_PORT:-3000}:3000"

volumes:
  pg_data:
