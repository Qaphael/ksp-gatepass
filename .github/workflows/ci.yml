name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Enable the locked pnpm version
        run: corepack enable && corepack prepare pnpm@12.15.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate operations scripts and Compose configuration
        run: |
          bash -n scripts/backup-postgres.sh scripts/restore-postgres-to-scratch.sh
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.https.yml config --quiet
      - name: Review production dependency advisories
        run: pnpm audit --prod --audit-level high
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit and integration tests
        run: |
          export TOKEN_ENCRYPTION_KEY="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64url"))')"
          pnpm test

  deploy:
    name: Deploy verified master to VPS
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.GATEPASS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: gatepass-production-deploy
      cancel-in-progress: false
    steps:
      - name: Check out verified commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure pinned VPS SSH
        env:
          DEPLOY_KEY: ${{ secrets.GATEPASS_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" || { echo "Missing GATEPASS_VPS_SSH_PRIVATE_KEY" >&2; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/gatepass_deploy"
          chmod 600 "$HOME/.ssh/gatepass_deploy"
          ssh-keyscan -t ed25519 212.47.72.186 > "$HOME/.ssh/known_hosts" 2>/dev/null
          fingerprint="$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk 'NR == 1 {print $2}')"
          test "$fingerprint" = "SHA256:0Wv+b7irBS/41NybPWrjHpU2fX8MgujT41DuTKlmtIk" || {
            echo "VPS host key fingerprint did not match the verified key" >&2
            exit 1
          }
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Deploy and rebuild Docker Compose services
        run: |
          set -euo pipefail
          git archive --format=tar "$GITHUB_SHA" |
            ssh -i "$HOME/.ssh/gatepass_deploy" \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              root@212.47.72.186 \
              "mkdir -p /opt/ksp-gatepass && tar -xf - -C /opt/ksp-gatepass && cd /opt/ksp-gatepass && docker compose up -d --build"
